name: FRConjugation
options:
  bundleIdPrefix: com.jacobshing
  deploymentTarget:
    macOS: "12.0"
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "27.2"
  postGenCommand: |
    # XcodeGen writes the legacy definition. Convert it on every regeneration.
    if [ -f FRConjugation.xcodeproj/project.pbxproj ]; then
      rm -f FRConjugation.xcodeproj/project.xcproj &&
        xcodebuild -project FRConjugation.xcodeproj -convert-project xcproj
    fi
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: FRConjugation

targets:
  FRConjugation:
    type: framework
    platform: macOS
    sources:
      - path: Sources/FRConjugation
        excludes:
          - Resources
      - path: ../catalogue/catalogue.fcr
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobshing.FRConjugation
        GENERATE_INFOPLIST_FILE: "YES"
        DEFINES_MODULE: "YES"
        PRODUCT_MODULE_NAME: FRConjugation
        DEAD_CODE_STRIPPING: "YES"
        ENABLE_MODULE_VERIFIER: "YES"
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
        SUPPORTED_PLATFORMS: "macosx iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SUPPORTS_MACCATALYST: "NO"

  FRConjugationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FRConjugationTests
        excludes:
          - Fixtures
      - path: ../tests/conformance.tsv
        buildPhase: resources
      - path: ../tests/typed-api.tsv
        buildPhase: resources
    dependencies:
      - target: FRConjugation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobshing.FRConjugationTests
        PRODUCT_MODULE_NAME: FRConjugationTests
        GENERATE_INFOPLIST_FILE: "YES"
        DEAD_CODE_STRIPPING: "YES"

schemes:
  FRConjugation:
    build:
      targets:
        FRConjugation: all
    test:
      targets:
        - FRConjugationTests
