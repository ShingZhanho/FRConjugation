name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to test and publish
        type: string
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate-catalogue:
    name: Verify shared catalogue provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check the bundled catalogue
        run: |
          python3 rules/compile.py rules/catalogue.rules "$RUNNER_TEMP/catalogue.fcr"
          cmp "$RUNNER_TEMP/catalogue.fcr" catalogue/catalogue.fcr

  build-and-test:
    name: Build & Test Swift Package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Test Swift package and public loading API
        run: |
          swift test -c release
          bin_dir="$(swift build -c release --show-bin-path)"
          verify_flags=(-Xfrontend -verify)
          if [[ "$(swiftc -frontend -help-hidden)" == *-verify-ignore-unrelated* ]]; then
            verify_flags+=(-Xfrontend -verify-ignore-unrelated)
          fi
          swiftc -typecheck "${verify_flags[@]}" \
            -I "$bin_dir" -I "$bin_dir/Modules" swift/Tests/Compiler/BundledModelOnly.swift

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [validate-catalogue, build-and-test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: releases/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            catalogue/catalogue.fcr
            rules/catalogue.rules
