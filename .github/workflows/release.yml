name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-test:
    name: Build & Test Swift Package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the bundled catalogue
        run: |
          python3 rules/compile.py rules/catalogue.rules "$RUNNER_TEMP/catalogue.fcr"
          cmp "$RUNNER_TEMP/catalogue.fcr" swift_lib/Sources/FRConjugation/Resources/catalogue.fcr

      - name: Test Swift package and public loading API
        run: |
          swift test -c release
          bin_dir="$(swift build -c release --show-bin-path)"
          swiftc -typecheck -Xfrontend -verify -Xfrontend -verify-ignore-unrelated \
            -I "$bin_dir" -I "$bin_dir/Modules" swift_lib/Tests/Compiler/BundledModelOnly.swift

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: releases/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            swift_lib/Sources/FRConjugation/Resources/catalogue.fcr
            rules/catalogue.rules
