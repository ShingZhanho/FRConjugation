name: Build Conjugation Rules

on:
  workflow_dispatch:

jobs:
  build-rules:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Download the catalogue
        run: |
          curl --fail --location --retry 3 \
            https://github.com/ShingZhanho/verbe-conjugaison-academie-francaise/releases/latest/download/verbs.db \
            --output "$RUNNER_TEMP/verbs.db"

      - name: Learn, compile and verify the rules
        run: |
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/rules/learn.py" verbs.db catalogue.rules
          python3 "$GITHUB_WORKSPACE/rules/compile.py" catalogue.rules catalogue.fcr
          python3 "$GITHUB_WORKSPACE/rules/oracle.py" verbs.db oracle.json
          swiftc -O "$GITHUB_WORKSPACE/swift/Sources/FRConjugation/RuleFile.swift" \
            "$GITHUB_WORKSPACE/rules/Verify.swift" -o verify-catalogue
          ./verify-catalogue catalogue.fcr oracle.json

      - uses: actions/upload-artifact@v4
        with:
          name: conjugation-rules
          path: |
            ${{ runner.temp }}/catalogue.rules
            ${{ runner.temp }}/catalogue.fcr
          if-no-files-found: error
