name: Publish distributions
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref (main for build-only; an existing vVERSION tag to publish)
        type: string
        default: main
        required: true
      publish:
        description: Publish externally after all package checks pass
        type: boolean
        default: false
      target:
        description: Distribution target
        type: choice
        options: [all, github, pypi, nuget, npm, maven]
        default: all
      npm_auth:
        description: npm bootstrap token for first publication; trusted after configuring npm OIDC
        type: choice
        options: [bootstrap, trusted]
        default: bootstrap
permissions:
  contents: read
concurrency:
  group: distribution-publishing
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/github-script@v7
        id: validate
        env:
          SOURCE_REF: ${{ inputs.ref }}
          PUBLISH: ${{ inputs.publish }}
          TARGET: ${{ inputs.target }}
        with:
          script: |
            const validate = require('./.github/scripts/validate-publish.cjs');
            await validate({ core, context, github });
  build:
    needs: validate
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  signing-check:
    if: github.ref == 'refs/heads/main' && (inputs.ref == 'main' || inputs.publish)
    needs: validate
    runs-on: ubuntu-latest
    environment: maven
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Verify signing without uploading to a registry
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          ./kotlin/gradlew -p kotlin publishToMavenLocal --no-daemon
          gpg --import kotlin/signing-key.asc
          mapfile -d '' signatures < <(find "$HOME/.m2/repository/com/jacobshing/frconjugation/$VERSION" -name '*.asc' -print0)
          test "${#signatures[@]}" -ge 4
          for signature in "${signatures[@]}"; do gpg --verify "$signature" "${signature%.asc}"; done
  pypi:
    if: inputs.publish && (inputs.target == 'all' || inputs.target == 'pypi')
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  nuget:
    if: inputs.publish && (inputs.target == 'all' || inputs.target == 'nuget')
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/login@v1
        id: login
        with:
          user: ShingZhanho
      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'dist/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
  npm:
    if: inputs.publish && (inputs.target == 'all' || inputs.target == 'npm')
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - name: Publish initial package with bootstrap token
        if: inputs.npm_auth == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.validate.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish dist/*.tgz --access public --provenance --tag "$NPM_DIST_TAG"
      - name: Publish with trusted publishing
        if: inputs.npm_auth == 'trusted'
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish dist/*.tgz --access public --tag "$NPM_DIST_TAG"
  maven:
    if: inputs.publish && (inputs.target == 'all' || inputs.target == 'maven')
    needs: [validate, build, signing-check]
    runs-on: ubuntu-latest
    environment: maven
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Sign and publish to Maven Central
        working-directory: kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralDeploymentValidation: PUBLISHED
        run: |
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          ./gradlew publishAndReleaseToMavenCentral --no-daemon
  github:
    if: inputs.publish && (inputs.target == 'all' || inputs.target == 'github')
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release for SwiftPM and native consumers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.whl' -o -name '*.nupkg' -o -name '*.jar' -o -name '*.fcr' -o -name '*.rules' \) -execdir sha256sum {} \; > artifacts/SHA256SUMS
          mapfile -d '' assets < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.whl' -o -name '*.nupkg' -o -name '*.jar' -o -name '*.fcr' -o -name '*.rules' \) -print0)
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" "${args[@]}" "${assets[@]}" artifacts/SHA256SUMS
