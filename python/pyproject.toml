[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobszh-frconjugation"
version = "5.1.0"
description = "French conjugation with bundled spelling rules"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "jacobszh"}]

[project.urls]
Homepage = "https://github.com/ShingZhanho/FRConjugation"
Repository = "https://github.com/ShingZhanho/FRConjugation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frconjugation = ["catalogue.fcr", "py.typed"]
